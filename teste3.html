<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage PRO - Produção de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root {
            --accent: #6366f1;
            --bg-dark: #050505;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: #efefef;
            -webkit-font-smoothing: antialiased;
            font-size: 12px; 
        }

        .tab-btn.active { 
            color: white; 
            border-left: 4px solid var(--accent); 
            padding-left: 12px; 
            background: linear-gradient(90deg, rgba(99,102,241,0.1) 0%, transparent 100%); 
        }
        
        textarea { 
            background-color: #0d0d0d; 
            border: 1px solid #1a1a1a; 
            color: #efefef; 
            min-height: 32px; 
            font-size: 11px;
            line-height: 1.3;
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            resize: none;
            overflow: hidden;
            transition: all 0.2s;
            display: block; 
        }
        
        textarea:focus { border-color: var(--accent) !important; outline: none; background-color: #121212 !important; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .map-container { overflow: visible !important; border: none !important; }
            .map-table { border: 2px solid #000 !important; width: 100% !important; }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 10px; }

        /* Mapa de Turnos Estruturado */
        .map-container {
            overflow-x: auto;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            background: #0a0a0a;
        }
        .map-table {
            border-collapse: collapse;
            font-size: 9px;
            table-layout: fixed;
        }
        .map-table th, .map-table td {
            border: 1px solid #1a1a1a;
            padding: 4px 2px;
            text-align: center;
        }
        .map-table th.event-header {
            min-width: 120px;
        }
        .map-table .col-staff {
            position: sticky;
            left: 0;
            background: #0d0d0d;
            z-index: 20;
            text-align: left;
            width: 140px;
            font-weight: 800;
            border-right: 2px solid #1a1a1a;
        }
        
        .shift-cell {
            width: 25px;
            font-weight: 900;
            font-size: 8px;
        }

        /* Legenda */
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            display: inline-block;
            margin-right: 6px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }
        .calendar-day {
            background-color: #050505;
            min-height: 150px;
            padding: 8px;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div id="quickStaffPicker" class="no-print hidden fixed z-50 bg-zinc-900 border border-zinc-800 rounded shadow-2xl max-h-48 overflow-y-auto w-44"></div>

    <aside class="w-52 flex-shrink-0 flex flex-col bg-black border-r border-zinc-900 no-print">
        <div class="p-4 border-b border-zinc-900">
            <h1 class="text-lg font-black tracking-tighter italic uppercase leading-none">Backstage<span class="text-indigo-500">PRO</span></h1>
            <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-[0.2em] mt-1">Gestão de Equipa</p>
        </div>

        <nav class="flex flex-col gap-1 mt-4 px-2">
            <button onclick="switchTab('events')" id="btn-tab-events" class="tab-btn active text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition">📅 Agenda</button>
            <button onclick="switchTab('calendar')" id="btn-tab-calendar" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">🗓️ Calendário</button>
            <button onclick="switchTab('staff')" id="btn-tab-staff" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">👥 Equipa</button>
            <button onclick="switchTab('venues')" id="btn-tab-venues" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">📍 Locais</button>
            <button onclick="switchTab('counter')" id="btn-tab-counter" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">📊 Mapa Turnos</button>
        </nav>

        <div class="mt-auto p-4 border-t border-zinc-900 space-y-2">
            <button onclick="createNewEvent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-lg text-[10px] uppercase tracking-widest transition">+ Novo Evento</button>
            <div class="flex gap-1.5">
                <button onclick="exportData()" class="flex-1 bg-zinc-900 text-zinc-500 py-2 rounded text-[8px] font-bold uppercase">Export</button>
                <button onclick="document.getElementById('importFile').click()" class="flex-1 bg-zinc-900 text-zinc-500 py-2 rounded text-[8px] font-bold uppercase">Import</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
            <button onclick="resetSystem()" class="w-full text-zinc-800 hover:text-red-900 text-[8px] font-black uppercase tracking-widest transition">Limpar Sistema</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-zinc-950 p-6">
        
        <!-- Agenda -->
        <div id="eventsView">
            <div class="flex flex-col lg:flex-row gap-6 h-full">
                <div class="w-full lg:w-48 no-print shrink-0">
                    <h2 class="text-[9px] font-black text-zinc-600 uppercase tracking-widest mb-3 px-1">Espectáculos</h2>
                    <div id="eventList" class="space-y-1"></div>
                </div>
                <div id="editorArea" class="flex-1 min-w-0 hidden">
                    <header class="flex justify-between items-start mb-4 border-b border-zinc-900 pb-4">
                        <div class="flex-1">
                            <input type="text" id="curEventName" oninput="updateActiveEvent('name', this.value)" class="bg-transparent border-none text-2xl font-black text-white p-0 focus:ring-0 w-full" placeholder="Título">
                            <div class="flex flex-wrap gap-4 mt-2">
                                <input type="date" id="curEventDate" oninput="updateActiveEvent('date', this.value)" class="bg-transparent border-none text-[11px] font-bold uppercase text-indigo-400 p-0 [color-scheme:dark]">
                                <input type="text" id="curEventVenue" oninput="processVenueCode(this)" placeholder="Cód + Local" class="bg-transparent border-none text-[11px] font-bold uppercase text-zinc-500 p-0 flex-1">
                            </div>
                        </div>
                        <div class="flex gap-2 no-print">
                            <button onclick="printSingleEvent()" class="bg-white text-black px-4 py-2 rounded text-[9px] font-black uppercase italic">🖨️ Imprimir Ficha</button>
                        </div>
                    </header>
                    <div class="rounded-xl border border-zinc-900 bg-zinc-900/10 overflow-hidden">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="bg-zinc-900 text-[8px] font-black text-zinc-500 uppercase tracking-widest">
                                    <th class="p-2 w-24">Turno / Hora</th>
                                    <th class="p-2 border-l border-zinc-800">Técnicos</th>
                                    <th class="p-2 border-l border-zinc-800">Produção</th>
                                    <th class="p-2 border-l border-zinc-800">Bilheteira</th>
                                    <th class="p-2 border-l border-zinc-800">Portas</th>
                                    <th class="p-2 border-l border-zinc-800">Bar / Seg.</th>
                                </tr>
                            </thead>
                            <tbody id="shiftsBody" class="divide-y divide-zinc-900/50"></tbody>
                        </table>
                    </div>
                </div>
                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center h-64 border border-dashed border-zinc-900 rounded-2xl text-zinc-800 uppercase font-black text-[10px]">
                    Selecione ou crie um evento
                </div>
            </div>
        </div>

        <!-- Mapa de Turnos -->
        <div id="counterView" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-black uppercase italic">Mapa Estruturado de Turnos</h2>
                    <p class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest mt-1">M: Manhã | T: Tarde | N: Noite | D: Desm.</p>
                </div>
                <button onclick="printTurnos()" class="bg-indigo-600 px-4 py-2 rounded text-[10px] font-black uppercase">🖨️ Imprimir Mapa</button>
            </div>
            
            <div class="map-container mb-6" id="autoTurnosMap"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
                <div>
                    <h3 class="text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-4">Legenda de Locais</h3>
                    <div id="venueLegend" class="flex flex-wrap gap-4"></div>
                </div>
                <div>
                    <h3 class="text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-4">Volume de Trabalho</h3>
                    <div id="monthlyCounterGrid" class="grid grid-cols-2 gap-2"></div>
                </div>
            </div>
        </div>

        <!-- Outras vistas -->
        <div id="calendarView" class="hidden"><div class="calendar-grid" id="calendarDays"></div></div>
        <div id="staffView" class="hidden"></div>
        <div id="venuesView" class="hidden"></div>

    </main>

    <script>
        const APP_COLUMNS = ['tecnicos', 'producao', 'bilheteira', 'portas', 'bar'];
        const VENUE_COLORS = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316'];
        const DEFAULT_SHIFTS = [
            { id: 'M', label: 'MANHÃ', time: '09:00' },
            { id: 'T', label: 'TARDE', time: '14:30' },
            { id: 'N', label: 'NOITE', time: '20:00' },
            { id: 'D', label: 'DESM.', time: '23:30' }
        ];

        let appData = JSON.parse(localStorage.getItem('backstage_pro_v5')) || {
            events: [],
            staff: { "rs": { name: "Rita Sousa" }, "mv": { name: "Madalena Victorino" } },
            venues: { "TP": "Teatro de Palha", "EN": "Escola Nova" },
            activeEventId: null
        };

        function saveData() { localStorage.setItem('backstage_pro_v5', JSON.stringify(appData)); }

        function resetSystem() {
            if(confirm("ATENÇÃO: Isto irá apagar TODOS os dados permanentemente. Continuar?")) {
                localStorage.removeItem('backstage_pro_v5');
                location.reload();
            }
        }

        function switchTab(tab) {
            ['events', 'calendar', 'staff', 'venues', 'counter'].forEach(t => {
                document.getElementById(t + 'View').classList.add('hidden');
                document.getElementById('btn-tab-' + t).classList.remove('active');
            });
            document.getElementById(tab + 'View').classList.remove('hidden');
            document.getElementById('btn-tab-' + tab).classList.add('active');
            if(tab === 'counter') updateTurnosMap();
            if(tab === 'calendar') renderCalendar();
            if(tab === 'staff') renderStaffManager();
            if(tab === 'venues') renderVenuesManager();
        }

        function selectEvent(id) {
            appData.activeEventId = id;
            const ev = appData.events.find(e => e.id === id);
            if (!ev) return;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editorArea').classList.remove('hidden');
            document.getElementById('curEventName').value = ev.name;
            document.getElementById('curEventDate').value = ev.date;
            document.getElementById('curEventVenue').value = ev.venue;
            renderShifts(ev);
            renderEventList();
        }

        function renderEventList() {
            const list = document.getElementById('eventList');
            const sorted = [...appData.events].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
            list.innerHTML = sorted.map(ev => `
                <div class="relative group">
                    <button onclick="selectEvent('${ev.id}')" class="w-full text-left p-2.5 rounded border ${appData.activeEventId === ev.id ? 'bg-indigo-600/10 border-indigo-500/50' : 'bg-zinc-900 border-zinc-900'} transition">
                        <div class="text-[7px] font-black text-indigo-400 uppercase mb-1">${ev.date ? ev.date.split('-').reverse().join('/') : 'S/ DATA'}</div>
                        <div class="text-[10px] font-bold text-white truncate">${ev.name}</div>
                    </button>
                    <button onclick="deleteEvent('${ev.id}')" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-zinc-700 hover:text-red-500 transition">×</button>
                </div>
            `).join('');
        }

        function renderShifts(ev) {
            const tbody = document.getElementById('shiftsBody');
            tbody.innerHTML = ev.shifts.map(s => `
                <tr>
                    <td class="p-2 align-top text-center bg-zinc-900/30">
                        <div class="text-[8px] font-black text-indigo-500 uppercase">${s.label}</div>
                        <input type="text" value="${s.time}" onchange="updateShiftField('${s.id}', 'time', this.value)" class="bg-transparent border-none text-[11px] font-black text-white text-center w-full p-0 focus:ring-0">
                    </td>
                    ${APP_COLUMNS.map(col => `
                        <td class="p-1 border-l border-zinc-900 align-top">
                            <textarea 
                                onclick="showStaffPicker(this, '${s.id}', '${col}')"
                                onkeyup="processCodes(this, '${s.id}', '${col}')" 
                                oninput="adjustHeight(this)"
                                placeholder="..." class="bg-transparent border-none text-[10px] text-zinc-300 w-full p-1 focus:ring-0">${s[col] || ''}</textarea>
                        </td>
                    `).join('')}
                </tr>
            `).join('');
            tbody.querySelectorAll('textarea').forEach(adjustHeight);
        }

        function adjustHeight(el) { el.style.height = '32px'; if (el.scrollHeight > 32) el.style.height = el.scrollHeight + 'px'; }

        function updateShiftField(sid, field, val) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            const shift = ev.shifts.find(s => s.id === sid);
            if(shift) { shift[field] = val; saveData(); }
        }

        /* Mapa de Turnos Refactorizado */
        function getVenueColor(venueName) {
            const venues = Object.values(appData.venues);
            const idx = venues.indexOf(venueName);
            return idx !== -1 ? VENUE_COLORS[idx % VENUE_COLORS.length] : '#333';
        }

        function updateTurnosMap() {
            const container = document.getElementById('autoTurnosMap');
            const legend = document.getElementById('venueLegend');
            const counter = document.getElementById('monthlyCounterGrid');
            
            const sortedEvents = [...appData.events].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
            const staffEntries = Object.entries(appData.staff).sort((a,b) => a[1].name.localeCompare(b[1].name));

            if(sortedEvents.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-zinc-800 font-black uppercase text-xs">Crie eventos para visualizar o mapa</div>`;
                return;
            }

            let html = `<table class="map-table"><thead><tr><th class="col-staff">Colaborador</th>`;
            
            // Cabeçalhos de Eventos (M T N D)
            sortedEvents.forEach(ev => {
                const color = getVenueColor(ev.venue);
                html += `<th colspan="4" class="event-header" style="border-top: 3px solid ${color}">
                    <div class="text-[7px] text-zinc-500">${ev.date ? ev.date.split('-').reverse().slice(0,2).join('/') : ''}</div>
                    <div class="truncate text-[9px] uppercase font-black">${ev.name}</div>
                    <div class="flex mt-1 border-t border-zinc-900">
                        <div class="flex-1 text-[7px] border-r border-zinc-900">M</div>
                        <div class="flex-1 text-[7px] border-r border-zinc-900">T</div>
                        <div class="flex-1 text-[7px] border-r border-zinc-900">N</div>
                        <div class="flex-1 text-[7px]">D</div>
                    </div>
                </th>`;
            });
            html += `</tr></thead><tbody>`;

            // Linhas de Staff
            const totals = {};
            staffEntries.forEach(([code, data]) => {
                totals[code] = 0;
                html += `<tr><td class="col-staff">${data.name}</td>`;
                
                sortedEvents.forEach(ev => {
                    const color = getVenueColor(ev.venue);
                    ['M','T','N','D'].forEach(shiftId => {
                        const shift = ev.shifts.find(s => s.id === shiftId);
                        let isActive = false;
                        if(shift) {
                            APP_COLUMNS.forEach(col => {
                                if(shift[col] && shift[col].toLowerCase().includes(data.name.toLowerCase())) isActive = true;
                            });
                        }
                        
                        if(isActive) totals[code]++;
                        html += `<td class="shift-cell" style="${isActive ? `background: ${color}; color: white;` : ''}">
                            ${isActive ? shiftId : ''}
                        </td>`;
                    });
                });
                html += `</tr>`;
            });
            
            html += `</tbody></table>`;
            container.innerHTML = html;

            // Legenda e Contadores
            legend.innerHTML = Object.values(appData.venues).map(v => `<div class="flex items-center text-[10px] font-bold text-zinc-400"><span class="legend-dot" style="background: ${getVenueColor(v)}"></span> ${v}</div>`).join('');
            counter.innerHTML = staffEntries.map(([code, data]) => `
                <div class="bg-zinc-900 p-2 rounded flex justify-between">
                    <span class="text-[10px] text-zinc-400">${data.name}</span>
                    <span class="text-indigo-400 font-black text-[10px]">${totals[code]} Turnos</span>
                </div>
            `).join('');
        }

        /* Core Functions */
        function createNewEvent() {
            const id = 'ev_' + Date.now();
            appData.events.unshift({
                id, name: "Novo Evento", date: new Date().toISOString().split('T')[0], venue: "",
                shifts: JSON.parse(JSON.stringify(DEFAULT_SHIFTS)) // Copia os turnos fixos
            });
            saveData(); switchTab('events'); selectEvent(id);
        }

        function deleteEvent(id) {
            if(confirm("Eliminar evento?")) {
                appData.events = appData.events.filter(e => e.id !== id);
                if(appData.activeEventId === id) appData.activeEventId = null;
                saveData(); renderEventList();
                if(!appData.activeEventId) { document.getElementById('emptyState').classList.remove('hidden'); document.getElementById('editorArea').classList.add('hidden'); }
            }
        }

        function processCodes(textarea, sid, col) {
            const val = textarea.value;
            const newVal = val.replace(/(\b\w+\b)([ ,;\n\r])/g, (match, code, delimiter) => {
                const s = appData.staff[code.toLowerCase()];
                return s ? s.name + delimiter : match;
            });
            if(newVal !== val) { textarea.value = newVal; updateShiftField(sid, col, newVal); }
            else { updateShiftField(sid, col, val); }
            adjustHeight(textarea);
        }

        function processVenueCode(input) {
            const val = input.value;
            for(let code in appData.venues) {
                if(val.toUpperCase() === code + " ") {
                    input.value = appData.venues[code];
                    updateActiveEvent('venue', appData.venues[code]);
                    return;
                }
            }
            updateActiveEvent('venue', val);
        }

        function updateActiveEvent(f, v) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) { ev[f] = v; saveData(); if(f==='name'||f==='date') renderEventList(); }
        }

        function showStaffPicker(textarea, sid, col) {
            const picker = document.getElementById('quickStaffPicker');
            picker.innerHTML = Object.values(appData.staff).map(s => `
                <div onclick="pickStaff('${s.name}', '${sid}', '${col}')" class="p-2 text-[10px] hover:bg-indigo-600 cursor-pointer border-b border-zinc-800">${s.name}</div>
            `).join('');
            const rect = textarea.getBoundingClientRect();
            picker.style.top = (rect.bottom + window.scrollY) + 'px';
            picker.style.left = (rect.left + window.scrollX) + 'px';
            picker.classList.remove('hidden');
            const close = (e) => { if(!picker.contains(e.target) && e.target !== textarea) { picker.classList.add('hidden'); document.removeEventListener('click', close); } };
            setTimeout(() => document.addEventListener('click', close), 10);
        }

        function pickStaff(name, sid, col) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            const shift = ev.shifts.find(s => s.id === sid);
            let current = shift[col] || "";
            shift[col] = current ? (current.trim().endsWith(',') ? current + " " + name : current + ", " + name) : name;
            saveData(); renderShifts(ev);
        }

        /* Managers */
        function renderStaffManager() {
            const view = document.getElementById('staffView');
            view.innerHTML = `<h2 class="text-xl font-black uppercase mb-6">Equipa</h2><div id="staffList" class="grid grid-cols-2 md:grid-cols-4 gap-2">${Object.entries(appData.staff).map(([c, d]) => `<div class="bg-zinc-900 p-3 rounded border border-zinc-800 flex justify-between"><span><b class="text-indigo-500 uppercase mr-2 text-[8px]">${c}</b>${d.name}</span><button onclick="delStaff('${c}')" class="text-zinc-700 hover:text-red-500">×</button></div>`).join('')}</div><div class="mt-4 flex gap-2"><input id="ns-c" placeholder="Cód" class="w-12 bg-zinc-900 border-zinc-800 rounded p-2 text-xs"><input id="ns-n" placeholder="Nome" class="bg-zinc-900 border-zinc-800 rounded p-2 text-xs flex-1"><button onclick="saveStaff()" class="bg-indigo-600 px-4 rounded text-[10px] font-black uppercase">Adicionar</button></div>`;
        }
        function saveStaff() { const c = document.getElementById('ns-c').value.toLowerCase(); const n = document.getElementById('ns-n').value; if(c && n) { appData.staff[c] = { name: n }; saveData(); renderStaffManager(); } }
        function delStaff(c) { delete appData.staff[c]; saveData(); renderStaffManager(); }

        function renderVenuesManager() {
            const view = document.getElementById('venuesView');
            view.innerHTML = `<h2 class="text-xl font-black uppercase mb-6">Locais</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-2">${Object.entries(appData.venues).map(([c, n]) => `<div class="bg-zinc-900 p-3 rounded border border-zinc-800 flex justify-between"><span><b class="text-zinc-500 mr-2 text-[8px]">${c}</b>${n}</span><button onclick="delVenue('${c}')" class="text-zinc-700 hover:text-red-500">×</button></div>`).join('')}</div><div class="mt-4 flex gap-2"><input id="nv-c" placeholder="Cód" class="w-12 bg-zinc-900 border-zinc-800 rounded p-2 text-xs"><input id="nv-n" placeholder="Nome Local" class="bg-zinc-900 border-zinc-800 rounded p-2 text-xs flex-1"><button onclick="saveVenue()" class="bg-indigo-600 px-4 rounded text-[10px] font-black uppercase">Adicionar</button></div>`;
        }
        function saveVenue() { const c = document.getElementById('nv-c').value.toUpperCase(); const n = document.getElementById('nv-n').value; if(c && n) { appData.venues[c] = n; saveData(); renderVenuesManager(); } }
        function delVenue(c) { delete appData.venues[c]; saveData(); renderVenuesManager(); }

        /* Print Ficha */
        function printSingleEvent() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            const html = `<div style="font-family:sans-serif; padding:30px;"><h1 style="text-transform:uppercase; margin:0">${ev.name}</h1><p><b>DATA:</b> ${ev.date} | <b>LOCAL:</b> ${ev.venue}</p><table style="width:100%; border-collapse:collapse; margin-top:20px;"><thead><tr style="background:#000; color:#fff;"><th>HORA</th>${APP_COLUMNS.map(c=>`<th style="text-transform:uppercase; font-size:10px; padding:5px;">${c}</th>`).join('')}</tr></thead><tbody>${ev.shifts.map(s=>`<tr><td style="border:1px solid #000; padding:10px; text-align:center;"><b>${s.label}</b><br>${s.time}</td>${APP_COLUMNS.map(c=>`<td style="border:1px solid #000; padding:10px; font-size:11px;">${s[c]||''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
            const win = window.open('', '_blank'); win.document.write(html); win.document.close(); setTimeout(()=> { win.print(); win.close(); }, 500);
        }

        function printTurnos() {
            const mapHtml = document.getElementById('autoTurnosMap').innerHTML;
            const win = window.open('', '_blank');
            win.document.write(`<html><head><style>body { font-family:sans-serif; } .map-table { width:100%; border-collapse:collapse; font-size:8px; } .map-table th, .map-table td { border:1px solid #000; padding:2px; } .col-staff { width: 100px; font-weight:bold; }</style></head><body><h1>MAPA GERAL DE TURNOS</h1>${mapHtml}</body></html>`);
            win.document.close(); setTimeout(()=> { win.print(); win.close(); }, 500);
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backstage_pro.json'; a.click();
        }

        function importData(e) {
            const fr = new FileReader();
            fr.onload = (ev) => { appData = JSON.parse(ev.target.result); saveData(); location.reload(); };
            fr.readAsText(e.target.files[0]);
        }

        window.onload = () => { renderEventList(); if(appData.activeEventId) selectEvent(appData.activeEventId); };
    </script>
</body>
</html>
