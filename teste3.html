<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage PRO - Produção de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root {
            --accent: #6366f1;
            --bg-dark: #050505;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: #efefef;
            -webkit-font-smoothing: antialiased;
            font-size: 13px; /* Reduzido ligeiramente a base */
        }

        .tab-btn.active { 
            color: white; 
            border-left: 4px solid var(--accent); 
            padding-left: 12px; 
            background: linear-gradient(90deg, rgba(99,102,241,0.1) 0%, transparent 100%); 
        }
        
        textarea { 
            background-color: #0d0d0d; 
            border: 1px solid #1a1a1a; 
            color: #efefef; 
            min-height: 38px; 
            font-size: 12px;
            line-height: 1.4;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            resize: none;
            overflow: hidden;
            transition: all 0.2s;
            display: block; 
        }
        
        textarea:focus { border-color: var(--accent) !important; outline: none; background-color: #121212 !important; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 10px; }

        .delete-btn {
            opacity: 0;
            transition: all 0.2s;
        }
        .event-card:hover .delete-btn {
            opacity: 1;
        }
        
        /* Ajuste para ecrãs médios/pequenos */
        .main-table {
            min-width: 900px; /* Garante que a tabela não colapse totalmente, permitindo scroll horizontal se necessário */
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar mais estreita (w-56 em vez de w-64) -->
    <aside class="w-56 flex-shrink-0 flex flex-col bg-black border-r border-zinc-900 no-print">
        <div class="p-5 border-b border-zinc-900">
            <h1 class="text-xl font-black tracking-tighter italic uppercase">Backstage<span class="text-indigo-500">PRO</span></h1>
            <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-[0.2em]">Operations Suite</p>
        </div>

        <nav class="flex flex-col gap-1 mt-4 px-2">
            <button onclick="switchTab('events')" id="btn-tab-events" class="tab-btn active text-left py-3 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition">
                📅 Agenda e Fichas
            </button>
            <button onclick="switchTab('staff')" id="btn-tab-staff" class="tab-btn text-left py-3 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">
                👥 Equipa Técnica
            </button>
            <button onclick="switchTab('venues')" id="btn-tab-venues" class="tab-btn text-left py-3 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">
                📍 Espaços e Locais
            </button>
            <button onclick="switchTab('counter')" id="btn-tab-counter" class="tab-btn text-left py-3 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">
                📊 Contagem Turnos
            </button>
        </nav>

        <div class="mt-auto p-4 border-t border-zinc-900 space-y-2">
            <div class="flex gap-2">
                <button onclick="exportData()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-500 py-2 rounded-lg text-[9px] font-bold uppercase">Export</button>
                <button onclick="document.getElementById('importFile').click()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-500 py-2 rounded-lg text-[9px] font-bold uppercase">Import</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
            <button onclick="createNewEvent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl text-[10px] uppercase tracking-widest transition">
                + Novo Espectáculo
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-zinc-950 p-4 md:p-6">
        
        <div id="eventsView">
            <div class="flex flex-col lg:flex-row gap-6">
                <!-- Lista lateral de eventos mais compacta -->
                <div class="w-full lg:w-60 no-print">
                    <h2 class="text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-3">Agenda</h2>
                    <div id="eventList" class="space-y-1.5"></div>
                </div>

                <div id="editorContainer" class="flex-1 min-w-0">
                    <div id="emptyState" class="flex flex-col items-center justify-center h-64 border-2 border-dashed border-zinc-900 rounded-3xl text-zinc-700">
                        <span class="text-2xl mb-3">📋</span>
                        <p class="text-[10px] font-black uppercase tracking-widest">Seleccione um espectáculo</p>
                    </div>

                    <div id="editorArea" class="hidden">
                        <header class="flex justify-between items-end mb-6 border-b border-zinc-900 pb-5">
                            <div class="flex-1 min-w-0">
                                <input type="text" id="curEventName" oninput="updateActiveEvent('name', this.value)" class="bg-transparent border-none text-3xl font-black text-white p-0 focus:ring-0 w-full truncate" placeholder="Nome do Espectáculo">
                                <div class="flex flex-wrap gap-4 mt-1">
                                    <input type="date" id="curEventDate" oninput="updateActiveEvent('date', this.value)" class="bg-transparent border-none text-[11px] font-bold uppercase focus:ring-0 p-0 [color-scheme:dark] text-indigo-400 w-32">
                                    <input type="text" id="curEventVenue" oninput="processVenueCode(this)" placeholder="Local (Cód. + Espaço)" class="bg-transparent border-none text-[11px] font-bold uppercase focus:ring-0 p-0 text-zinc-400 flex-1 min-w-[150px]">
                                </div>
                            </div>
                            <div class="flex gap-2 no-print ml-4 shrink-0">
                                <button onclick="addShift()" class="bg-zinc-900 px-3 py-1.5 rounded-lg text-[9px] font-black uppercase text-zinc-400 hover:bg-zinc-800 transition">+ Horário</button>
                                <button onclick="printSingleEvent()" class="bg-white text-black px-3 py-1.5 rounded-lg text-[9px] font-black uppercase shadow-lg hover:bg-zinc-200 transition">Imprimir</button>
                                <button onclick="printAllEvents()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-[9px] font-black uppercase transition">Todas</button>
                            </div>
                        </header>

                        <div class="overflow-x-auto rounded-xl border border-zinc-900 bg-zinc-900/10">
                            <table class="main-table w-full text-left table-fixed">
                                <thead>
                                    <tr class="bg-zinc-900/50 text-[9px] font-black text-zinc-500 uppercase tracking-widest">
                                        <th class="p-3 w-32">Fase / Hora</th>
                                        <th class="p-3 border-l border-zinc-800">Técnicos</th>
                                        <th class="p-3 border-l border-zinc-800">Produção</th>
                                        <th class="p-3 border-l border-zinc-800">Bilheteira</th>
                                        <th class="p-3 border-l border-zinc-800">Portas</th>
                                        <th class="p-3 border-l border-zinc-800">Bar/Coz.</th>
                                        <th class="p-3 border-l border-zinc-800">Segur.</th>
                                        <th class="p-3 w-8 no-print"></th>
                                    </tr>
                                </thead>
                                <tbody id="shiftsBody" class="divide-y divide-zinc-900/50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Outras Views (Mantidas similares, mas com escala ajustada) -->
        <div id="staffView" class="hidden">
            <h2 class="text-xl font-black uppercase mb-6 italic">Gestão de Equipa</h2>
            <div class="bg-zinc-900/40 p-6 rounded-2xl border border-zinc-900 mb-8 max-w-2xl">
                <div class="flex gap-3">
                    <input type="text" id="newStaffCode" placeholder="Cód (Auto)" class="w-24 bg-black border border-zinc-800 rounded-lg px-3 py-2 text-xs outline-none focus:border-indigo-500">
                    <input type="text" id="newStaffName" onkeydown="if(event.key === 'Enter') addStaffMember()" placeholder="Nome Completo" class="flex-1 bg-black border border-zinc-800 rounded-lg px-3 py-2 text-xs outline-none focus:border-indigo-500">
                    <button onclick="addStaffMember()" class="bg-indigo-600 px-6 py-2 rounded-lg text-[10px] font-black uppercase">Add</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-3" id="staffGrid"></div>
        </div>

        <div id="venuesView" class="hidden">
            <h2 class="text-xl font-black uppercase mb-6 italic">Gestão de Espaços</h2>
            <div class="bg-zinc-900/40 p-6 rounded-2xl border border-zinc-900 mb-8 max-w-2xl">
                <div class="flex gap-3">
                    <input type="text" id="newVenueCode" placeholder="Cód" class="w-24 bg-black border border-zinc-800 rounded-lg px-3 py-2 text-xs outline-none focus:border-indigo-500">
                    <input type="text" id="newVenueName" onkeydown="if(event.key === 'Enter') addVenue()" placeholder="Nome do Local" class="flex-1 bg-black border border-zinc-800 rounded-lg px-3 py-2 text-xs outline-none focus:border-indigo-500">
                    <button onclick="addVenue()" class="bg-indigo-600 px-6 py-2 rounded-lg text-[10px] font-black uppercase">Add</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" id="venueGrid"></div>
        </div>

        <div id="counterView" class="hidden">
            <div class="flex justify-between items-center mb-6 border-b border-zinc-900 pb-4">
                <div>
                    <h2 class="text-2xl font-black uppercase italic">Resumo de Turnos</h2>
                    <p class="text-xs text-zinc-500 font-bold uppercase tracking-widest">Contagem acumulada</p>
                </div>
                <button onclick="printTurnos()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-xl text-xs font-black uppercase transition shadow-lg">Imprimir Contagem</button>
            </div>
            <div id="monthlyCounterGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
        </div>

    </main>

    <script>
        const APP_COLUMNS = ['tecnicos', 'producao', 'bilheteira', 'portas', 'bar', 'seguranca'];

        let appData = JSON.parse(localStorage.getItem('backstage_pro_v2')) || {
            events: [],
            staff: { "101": { name: "EXEMPLO TÉCNICO" } },
            venues: { "TNM": "Teatro Nacional" },
            activeEventId: null
        };

        function saveData() {
            localStorage.setItem('backstage_pro_v2', JSON.stringify(appData));
        }

        function switchTab(tab) {
            ['events', 'staff', 'venues', 'counter'].forEach(t => {
                document.getElementById(t + 'View').classList.add('hidden');
                document.getElementById('btn-tab-' + t).classList.remove('active');
            });
            document.getElementById(tab + 'View').classList.remove('hidden');
            document.getElementById('btn-tab-' + tab).classList.add('active');

            if(tab === 'staff') renderStaff();
            if(tab === 'venues') renderVenues();
            if(tab === 'counter') updateMonthlyCount();
            if(tab === 'events') renderEventList();
        }

        function renderEventList() {
            const list = document.getElementById('eventList');
            const sorted = [...appData.events].sort((a, b) => {
                if (!a.date) return 1;
                if (!b.date) return -1;
                return a.date.localeCompare(b.date);
            });
            
            list.innerHTML = sorted.map(ev => `
                <div class="event-card relative group">
                    <button onclick="selectEvent('${ev.id}')" class="w-full text-left p-3 rounded-lg border ${appData.activeEventId === ev.id ? 'bg-indigo-600/10 border-indigo-500/50' : 'bg-zinc-900/40 border-zinc-900'} hover:border-zinc-700 transition">
                        <div class="text-[9px] font-black text-indigo-400 uppercase">${ev.date ? ev.date.split('-').reverse().join('/') : 'Sem data'}</div>
                        <div class="text-xs font-bold text-white truncate pr-5">${ev.name}</div>
                    </button>
                    <button onclick="deleteEvent('${ev.id}')" class="delete-btn absolute top-3 right-2 text-zinc-700 hover:text-red-500 text-lg leading-none no-print">×</button>
                </div>
            `).join('');
        }

        function deleteEvent(id) {
            const ev = appData.events.find(e => e.id === id);
            if (confirm(`Deseja apagar "${ev.name}"?`)) {
                appData.events = appData.events.filter(e => e.id !== id);
                if (appData.activeEventId === id) {
                    appData.activeEventId = null;
                    document.getElementById('editorArea').classList.add('hidden');
                    document.getElementById('emptyState').classList.remove('hidden');
                }
                saveData();
                renderEventList();
            }
        }

        function selectEvent(id) {
            appData.activeEventId = id;
            const ev = appData.events.find(e => e.id === id);
            if (!ev) return;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editorArea').classList.remove('hidden');
            document.getElementById('curEventName').value = ev.name;
            document.getElementById('curEventDate').value = ev.date;
            document.getElementById('curEventVenue').value = ev.venue;
            
            renderShifts(ev);
            renderEventList();
        }

        function sortShifts(ev) {
            if (!ev || !ev.shifts) return;
            ev.shifts.sort((a, b) => (a.time || "00:00").localeCompare(b.time || "00:00"));
        }

        function renderShifts(ev) {
            const tbody = document.getElementById('shiftsBody');
            tbody.innerHTML = ev.shifts.map(s => `
                <tr class="group hover:bg-zinc-900/30">
                    <td class="p-2 align-top">
                        <textarea oninput="updateShiftField('${s.id}', 'label', this.value); adjustHeight(this)" 
                                  class="bg-transparent border-none text-[10px] font-black text-indigo-400 uppercase w-full p-0 focus:ring-0 mb-0.5" 
                                  placeholder="FASE">${s.label || ''}</textarea>
                        <input type="text" value="${s.time}" 
                               onchange="updateShiftField('${s.id}', 'time', this.value); sortAndReRender()" 
                               class="bg-transparent border-none text-xs font-black text-white w-full p-0 focus:ring-0" 
                               placeholder="00:00">
                    </td>
                    ${APP_COLUMNS.map(col => `
                        <td class="p-1.5 border-l border-zinc-900/50 align-top">
                            <textarea onkeyup="processShortcodes(this, '${s.id}', '${col}')" oninput="adjustHeight(this)" placeholder="..." class="text-[11px]"> ${s[col] || ''}</textarea>
                        </td>
                    `).join('')}
                    <td class="p-2 no-print align-top text-right">
                        <button onclick="removeShift('${s.id}')" class="text-zinc-800 hover:text-red-500 transition text-xl">×</button>
                    </td>
                </tr>
            `).join('');
            
            setTimeout(() => { tbody.querySelectorAll('textarea').forEach(adjustHeight); }, 50);
        }

        function sortAndReRender() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if (ev) {
                sortShifts(ev);
                saveData();
                renderShifts(ev);
            }
        }

        function adjustHeight(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function updateActiveEvent(field, val) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                ev[field] = val;
                saveData();
                if(field === 'name' || field === 'date') renderEventList();
            }
        }

        function updateShiftField(shiftId, field, val) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                const shift = ev.shifts.find(s => s.id === shiftId);
                if(shift) {
                    shift[field] = val;
                    saveData();
                }
            }
        }

        function processShortcodes(textarea, shiftId, field) {
            const val = textarea.value;
            const regex = /(\b\w+\b)([ ,;\n\r])/g;
            let changed = false;
            const newVal = val.replace(regex, (match, code, delimiter) => {
                if (appData.staff[code]) {
                    changed = true;
                    return appData.staff[code].name + delimiter;
                }
                return match;
            });
            if (changed) {
                textarea.value = newVal;
                updateShiftField(shiftId, field, newVal);
            } else {
                updateShiftField(shiftId, field, val);
            }
            adjustHeight(textarea);
        }

        function processVenueCode(input) {
            const val = input.value;
            for(let code in appData.venues) {
                if(val.toUpperCase() === code.toUpperCase() + " ") {
                    input.value = appData.venues[code];
                    updateActiveEvent('venue', appData.venues[code]);
                    return;
                }
            }
            updateActiveEvent('venue', val);
        }

        // FUNÇÃO DE IMPRESSÃO MELHORADA PARA P&B
        function buildEventHTML(ev) {
            const cols = ['Técnicos','Produção','Bilheteira','Portas','Bar/Coz.','Segur.'];
            const keys = ['tecnicos','producao','bilheteira','portas','bar','seguranca'];
            sortShifts(ev);

            const rows = ev.shifts.map(s => `
                <tr>
                    <td style="padding:10px 8px; border:1px solid #000; font-size:10px; vertical-align:top; background:#f2f2f2; line-height:1.3;">
                        <div style="color:#000; font-weight:900; text-transform:uppercase; margin-bottom:2px;">${(s.label||'').toUpperCase()}</div>
                        <div style="color:#000; font-weight:900; border-top:1px solid #000; padding-top:2px; font-size:14px;">${s.time||''}</div>
                    </td>
                    ${keys.map(k => `<td style="padding:10px 8px; border:1px solid #000; font-size:11px; vertical-align:top; white-space:pre-wrap; word-break:break-word; line-height:1.4; color:#000;">${(s[k]||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</td>`).join('')}
                </tr>`).join('');

            return `
                <div class="ev-block" style="margin-bottom: 40px; page-break-after: always;">
                    <div style="border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;">
                        <div>
                            <h2 style="font-size:28px; font-weight:900; margin:0; text-transform:uppercase; letter-spacing:-0.5px">${ev.name}</h2>
                            <p style="font-size:13px; color:#000; margin:4px 0 0; font-weight:800; text-transform:uppercase; letter-spacing:0.5px">${ev.date}${ev.venue ? ' &bull; ' + ev.venue : ''}</p>
                        </div>
                        <div style="text-align:right; font-size:9px; font-weight:900; color:#555; text-transform:uppercase;">Backstage PRO Ops</div>
                    </div>
                    <table style="width:100%; border-collapse:collapse; table-layout:fixed; border:2px solid #000;">
                        <thead>
                            <tr style="background:#000; font-size:10px; font-weight:900; text-transform:uppercase; color:#fff">
                                <th style="padding:12px 8px; border:1px solid #000; width:110px; text-align:left">Fase / Hora</th>
                                ${cols.map(c=>`<th style="padding:12px 8px; border:1px solid #000; text-align:left">${c}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        function printTurnos() {
            const counts = {};
            const displayName = {};
            appData.events.forEach(ev => {
                ev.shifts.forEach(s => {
                    const uniqueInShift = new Set();
                    APP_COLUMNS.forEach(col => {
                        if (s[col]) {
                            s[col].split(/[,\n;]/).forEach(n => {
                                const clean = n.trim();
                                if(clean.length > 2) {
                                    uniqueInShift.add(clean.toLowerCase());
                                    displayName[clean.toLowerCase()] = clean;
                                }
                            });
                        }
                    });
                    uniqueInShift.forEach(nameLower => counts[nameLower] = (counts[nameLower] || 0) + 1);
                });
            });

            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            let html = `
                <div style="padding: 10px;">
                    <div style="border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 25px;">
                        <h1 style="font-size:24px; font-weight:900; margin:0; text-transform:uppercase;">Resumo Geral de Turnos</h1>
                        <p style="font-size:11px; color:#000; text-transform:uppercase; font-weight:800; margin-top:4px;">Total Colaboradores: ${sorted.length} &bull; Gerado em: ${new Date().toLocaleDateString()}</p>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                        ${sorted.map(([nameLower, count]) => `
                            <div style="border-bottom: 1px solid #ccc; padding: 6px 0; display: flex; justify-content: space-between; align-items: center; break-inside: avoid;">
                                <span style="font-weight:700; font-size:12px; text-transform: uppercase;">${displayName[nameLower]}</span>
                                <span style="background:#eee; padding:3px 8px; border-radius:3px; font-weight:900; font-size:13px; border:1px solid #000;">${count}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            executePrint(html, 'Contagem Turnos');
        }

        function executePrint(contentHtml, title = 'Backstage PRO') {
            const win = window.open('', '_blank');
            win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title>
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
                    @page { size: portrait; margin: 1cm; }
                    body { font-family: 'Inter', sans-serif; color: #000; background: #fff; line-height: 1.4; }
                    .ev-block { page-break-inside: avoid; }
                    table { width: 100%; border-collapse: collapse; }
                </style>
            </head><body>${contentHtml}</body></html>`);
            win.document.close();
            win.focus();
            setTimeout(() => { win.print(); }, 500);
        }

        function printSingleEvent() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) executePrint(buildEventHTML(ev), `Ficha - ${ev.name}`);
        }

        function printAllEvents() {
            const sorted = [...appData.events].sort((a,b) => (a.date||"").localeCompare(b.date||""));
            executePrint(sorted.map(ev => buildEventHTML(ev)).join(''), 'Todas as Fichas');
        }

        function createNewEvent() {
            switchTab('events');
            const id = 'ev_' + Date.now();
            const newEv = {
                id,
                name: "Novo Espectáculo",
                date: new Date().toISOString().split('T')[0],
                venue: "",
                shifts: [
                    { id: 's1', label: 'MONTAGEM', time: '10:00', tecnicos:'', producao:'', bilheteira:'', portas:'', bar:'', seguranca:'' },
                    { id: 's2', label: 'ESPETÁCULO', time: '21:30', tecnicos:'', producao:'', bilheteira:'', portas:'', bar:'', seguranca:'' }
                ]
            };
            appData.events.unshift(newEv);
            appData.activeEventId = id;
            saveData();
            renderEventList();
            selectEvent(id);
        }

        function addShift() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                const newShift = { id: 's'+Date.now(), label:'FASE', time:'12:00' };
                APP_COLUMNS.forEach(c => newShift[c] = '');
                ev.shifts.push(newShift);
                sortShifts(ev);
                saveData();
                renderShifts(ev);
            }
        }

        function removeShift(id) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev && confirm("Remover esta fase?")) {
                ev.shifts = ev.shifts.filter(s => s.id !== id);
                renderShifts(ev);
                saveData();
            }
        }

        function addStaffMember() {
            let code = document.getElementById('newStaffCode').value.trim();
            const name = document.getElementById('newStaffName').value.trim();
            if(!name) return;
            if(!code) {
                const existing = Object.keys(appData.staff).map(c => parseInt(c)).filter(n => !isNaN(n));
                code = existing.length > 0 ? (Math.max(...existing) + 1).toString() : "101";
            }
            appData.staff[code] = { name };
            saveData();
            renderStaff();
            document.getElementById('newStaffCode').value = '';
            document.getElementById('newStaffName').value = '';
            document.getElementById('newStaffName').focus();
        }

        function renderStaff() {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = Object.entries(appData.staff).map(([code, data]) => `
                <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex justify-between items-center group">
                    <div>
                        <div class="text-[8px] font-black text-indigo-500 uppercase">${code}</div>
                        <div class="text-[11px] font-bold text-white">${data.name}</div>
                    </div>
                    <button onclick="deleteStaff('${code}')" class="text-zinc-800 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">×</button>
                </div>
            `).join('');
        }

        function deleteStaff(code) {
            if(confirm("Eliminar técnico?")) {
                delete appData.staff[code];
                saveData();
                renderStaff();
            }
        }

        function addVenue() {
            let code = document.getElementById('newVenueCode').value.trim().toUpperCase();
            const name = document.getElementById('newVenueName').value.trim();
            if(!name) return;
            if(!code) code = name.substring(0, 3).toUpperCase() + (Object.keys(appData.venues).length + 1);
            appData.venues[code] = name;
            saveData();
            renderVenues();
            document.getElementById('newVenueCode').value = '';
            document.getElementById('newVenueName').value = '';
            document.getElementById('newVenueName').focus();
        }

        function renderVenues() {
            const grid = document.getElementById('venueGrid');
            grid.innerHTML = Object.entries(appData.venues).map(([code, name]) => `
                <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex justify-between items-center group">
                    <div>
                        <div class="text-[8px] font-black text-indigo-400 uppercase">${code}</div>
                        <div class="text-[11px] font-bold text-white">${name}</div>
                    </div>
                    <button onclick="deleteVenue('${code}')" class="text-zinc-800 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">×</button>
                </div>
            `).join('');
        }

        function deleteVenue(code) {
            if(confirm("Eliminar local?")) {
                delete appData.venues[code];
                saveData();
                renderVenues();
            }
        }

        function updateMonthlyCount() {
            const counts = {};
            const displayName = {};
            appData.events.forEach(ev => {
                ev.shifts.forEach(s => {
                    const uniqueInShift = new Set();
                    APP_COLUMNS.forEach(col => {
                        if (s[col]) {
                            s[col].split(/[,\n;]/).forEach(n => {
                                const clean = n.trim();
                                if(clean.length > 2) {
                                    uniqueInShift.add(clean.toLowerCase());
                                    displayName[clean.toLowerCase()] = clean;
                                }
                            });
                        }
                    });
                    uniqueInShift.forEach(nameLower => counts[nameLower] = (counts[nameLower] || 0) + 1);
                });
            });
            const grid = document.getElementById('monthlyCounterGrid');
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            if(sorted.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-12 text-center text-zinc-700 font-bold uppercase text-[10px] tracking-widest border border-dashed border-zinc-900 rounded-3xl">Sem registos</div>';
                return;
            }
            grid.innerHTML = sorted.map(([nameLower, count]) => `
                <div class="bg-zinc-900/50 p-3 rounded-lg border border-zinc-900 flex justify-between items-center">
                    <span class="text-[11px] font-bold text-white">${displayName[nameLower]}</span>
                    <span class="bg-indigo-600/20 text-indigo-400 text-[9px] font-black px-2 py-0.5 rounded-full border border-indigo-500/10">${count}</span>
                </div>
            `).join('');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backstage_pro_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importData(event) {
            const reader = new FileReader();
            reader.onload = (e) => {
                appData = JSON.parse(e.target.result);
                saveData();
                location.reload();
            };
            reader.readAsText(event.target.files[0]);
        }

        window.onload = () => {
            renderEventList();
            if(appData.activeEventId) selectEvent(appData.activeEventId);
        };
    </script>
</body>
</html>
