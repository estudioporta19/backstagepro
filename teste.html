<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage PRO - Produção de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root {
            --accent: #6366f1;
            --bg-dark: #050505;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: #efefef;
            -webkit-font-smoothing: antialiased;
            font-size: 12px; 
        }

        .tab-btn.active { 
            color: white; 
            border-left: 4px solid var(--accent); 
            padding-left: 12px; 
            background: linear-gradient(90deg, rgba(99,102,241,0.1) 0%, transparent 100%); 
        }
        
        textarea { 
            background-color: #0d0d0d; 
            border: 1px solid #1a1a1a; 
            color: #efefef; 
            min-height: 32px; 
            font-size: 11px;
            line-height: 1.3;
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            resize: none;
            overflow: hidden;
            transition: all 0.2s;
            display: block; 
        }
        
        textarea:focus { border-color: var(--accent) !important; outline: none; background-color: #121212 !important; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 10px; }

        .delete-btn { opacity: 0; transition: all 0.2s; }
        .event-card:hover .delete-btn { opacity: 1; }

        .main-table {
            table-layout: fixed;
            width: 100%;
        }

        .col-phase { width: 85px; }

        /* Estilos para o Seletor de Equipa Rápido */
        #quickStaffPicker {
            position: fixed;
            z-index: 50;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            width: 180px;
        }
        .staff-item {
            padding: 6px 10px;
            font-size: 10px;
            cursor: pointer;
            border-bottom: 1px solid #27272a;
            transition: background 0.2s;
        }
        .staff-item:hover { background: #2563eb; color: white; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Seletor Flutuante de Equipa -->
    <div id="quickStaffPicker" class="no-print"></div>

    <!-- Sidebar -->
    <aside class="w-52 flex-shrink-0 flex flex-col bg-black border-r border-zinc-900 no-print">
        <div class="p-4 border-b border-zinc-900">
            <h1 class="text-lg font-black tracking-tighter italic uppercase leading-none">Backstage<span class="text-indigo-500">PRO</span></h1>
            <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-[0.2em] mt-1">Ops Suite</p>
        </div>

        <nav class="flex flex-col gap-1 mt-4 px-2">
            <button onclick="switchTab('events')" id="btn-tab-events" class="tab-btn active text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition">
                📅 Agenda
            </button>
            <button onclick="switchTab('staff')" id="btn-tab-staff" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">
                👥 Equipa
            </button>
            <button onclick="switchTab('venues')" id="btn-tab-venues" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">
                📍 Locais
            </button>
            <button onclick="switchTab('counter')" id="btn-tab-counter" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">
                📊 Turnos
            </button>
        </nav>

        <div class="mt-auto p-4 border-t border-zinc-900 space-y-2">
            <div class="flex gap-1.5">
                <button onclick="exportData()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-500 py-2 rounded text-[8px] font-bold uppercase">Export</button>
                <button onclick="document.getElementById('importFile').click()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-500 py-2 rounded text-[8px] font-bold uppercase">Import</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
            
            <button onclick="printAllEvents()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2 rounded-lg text-[9px] uppercase tracking-widest transition">
                🖨️ Imprimir Agenda
            </button>

            <button onclick="createNewEvent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-lg text-[10px] uppercase tracking-widest transition shadow-lg shadow-indigo-900/20">
                + Novo Evento
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-zinc-950 p-4">
        
        <div id="eventsView">
            <div class="flex flex-col lg:flex-row gap-4 h-full">
                <div class="w-full lg:w-48 no-print shrink-0">
                    <h2 class="text-[9px] font-black text-zinc-600 uppercase tracking-widest mb-3 px-1">Próximos Dias</h2>
                    <div id="eventList" class="space-y-1"></div>
                </div>

                <div id="editorContainer" class="flex-1 min-w-0">
                    <div id="emptyState" class="flex flex-col items-center justify-center h-64 border border-dashed border-zinc-900 rounded-2xl text-zinc-800">
                        <p class="text-[10px] font-black uppercase tracking-widest italic">Nenhum evento selecionado</p>
                    </div>

                    <div id="editorArea" class="hidden">
                        <header class="flex justify-between items-start mb-4 border-b border-zinc-900 pb-4">
                            <div class="flex-1 min-w-0 pr-4">
                                <input type="text" id="curEventName" oninput="updateActiveEvent('name', this.value)" class="bg-transparent border-none text-2xl font-black text-white p-0 focus:ring-0 w-full truncate" placeholder="Título">
                                <div class="flex flex-wrap gap-3 mt-1">
                                    <input type="date" id="curEventDate" oninput="updateActiveEvent('date', this.value)" class="bg-transparent border-none text-[10px] font-bold uppercase focus:ring-0 p-0 [color-scheme:dark] text-indigo-400 w-28">
                                    <input type="text" id="curEventVenue" oninput="processVenueCode(this)" placeholder="Cód + Local" class="bg-transparent border-none text-[10px] font-bold uppercase focus:ring-0 p-0 text-zinc-500 flex-1 min-w-[120px]">
                                </div>
                            </div>
                            <div class="flex gap-1.5 no-print shrink-0">
                                <button onclick="duplicateActiveEvent()" title="Duplicar Evento" class="bg-zinc-900 p-2 rounded text-zinc-400 hover:text-white transition">👯</button>
                                <button onclick="addShift()" class="bg-zinc-900 px-3 py-2 rounded text-[9px] font-black uppercase text-zinc-400 hover:bg-zinc-800 transition">+ Fase</button>
                                <button onclick="printSingleEvent()" class="bg-white text-black px-3 py-2 rounded text-[9px] font-black uppercase shadow-lg hover:bg-zinc-200 transition">Imprimir</button>
                            </div>
                        </header>

                        <div class="rounded-xl border border-zinc-900 bg-zinc-900/10 overflow-hidden">
                            <table class="main-table">
                                <thead>
                                    <tr class="bg-zinc-900 text-[8px] font-black text-zinc-500 uppercase tracking-widest">
                                        <th class="p-2 col-phase text-center">Fase/Hora</th>
                                        <th class="p-2 border-l border-zinc-800">Técnicos</th>
                                        <th class="p-2 border-l border-zinc-800">Produção</th>
                                        <th class="p-2 border-l border-zinc-800">Bilheteira</th>
                                        <th class="p-2 border-l border-zinc-800">Portas</th>
                                        <th class="p-2 border-l border-zinc-800">Bar/Coz.</th>
                                        <th class="p-2 border-l border-zinc-800">Segur.</th>
                                        <th class="p-2 w-8 no-print"></th>
                                    </tr>
                                </thead>
                                <tbody id="shiftsBody" class="divide-y divide-zinc-900/50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Views Gestão -->
        <div id="staffView" class="hidden">
            <h2 class="text-lg font-black uppercase mb-4 italic">Equipa</h2>
            <div class="flex gap-2 mb-6 max-w-xl">
                <input type="text" id="newStaffCode" placeholder="Cód" class="w-16 bg-zinc-900 border-none rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500">
                <input type="text" id="newStaffName" onkeydown="if(event.key === 'Enter') addStaffMember()" placeholder="Nome" class="flex-1 bg-zinc-900 border-none rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500">
                <button onclick="addStaffMember()" class="bg-indigo-600 px-4 py-2 rounded text-[9px] font-black uppercase">Adicionar</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2" id="staffGrid"></div>
        </div>

        <div id="venuesView" class="hidden">
            <h2 class="text-lg font-black uppercase mb-4 italic">Locais</h2>
            <div class="flex gap-2 mb-6 max-w-xl">
                <input type="text" id="newVenueCode" placeholder="Cód" class="w-16 bg-zinc-900 border-none rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500">
                <input type="text" id="newVenueName" onkeydown="if(event.key === 'Enter') addVenue()" placeholder="Nome" class="flex-1 bg-zinc-900 border-none rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500">
                <button onclick="addVenue()" class="bg-indigo-600 px-4 py-2 rounded text-[9px] font-black uppercase">Adicionar</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2" id="venueGrid"></div>
        </div>

        <div id="counterView" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-black uppercase italic">Contagem de Turnos</h2>
                <button onclick="printTurnos()" class="bg-indigo-600 px-4 py-2 rounded text-[9px] font-black uppercase">Imprimir Mapa</button>
            </div>
            <div id="monthlyCounterGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2"></div>
        </div>

    </main>

    <script>
        const APP_COLUMNS = ['tecnicos', 'producao', 'bilheteira', 'portas', 'bar', 'seguranca'];

        // Dados padrão solicitados
        const defaultStaff = {
            "rs": { name: "Rita Sousa" },
            "mv": { name: "Madalena Victorino" },
            "gs": { name: "Giacomo Scalisi" },
            "ss": { name: "Sandra Sanches" },
            "is": { name: "Inderjeet Singh" },
            "gs": { name: "Gurpreet Singh" },
            "as": { name: "Alexandra Silva" },
            "rf": { name: "Ricardo Falcão" },
            "mm": { name: "Marisa Miranda" },
            "jm": { name: "Joaquim Madaíl" },
            "aj": { name: "Ajudante João" },
            "am": { name: "Ajudante Manuel" }
        };

        const defaultVenues = {
            "TP": "Teatro de Palha",
            "EN": "Escola Nova",
            "NB": "Novo Bowing",
            "NANC": "Novo Ano Novo Circo",
        };

        let appData = JSON.parse(localStorage.getItem('backstage_pro_v3'));

        // Se não houver dados, inicializa com os novos padrões
        if (!appData) {
            appData = {
                events: [],
                staff: defaultStaff,
                venues: defaultVenues,
                activeEventId: null
            };
        }

        function saveData() { localStorage.setItem('backstage_pro_v3', JSON.stringify(appData)); }

        function switchTab(tab) {
            ['events', 'staff', 'venues', 'counter'].forEach(t => {
                const elView = document.getElementById(t + 'View');
                const elBtn = document.getElementById('btn-tab-' + t);
                if(elView) elView.classList.add('hidden');
                if(elBtn) elBtn.classList.remove('active');
            });
            document.getElementById(tab + 'View').classList.remove('hidden');
            document.getElementById('btn-tab-' + tab).classList.add('active');
            if(tab === 'staff') renderStaff();
            if(tab === 'venues') renderVenues();
            if(tab === 'counter') updateMonthlyCount();
            if(tab === 'events') renderEventList();
        }

        function renderEventList() {
            const list = document.getElementById('eventList');
            const sorted = [...appData.events].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
            list.innerHTML = sorted.map(ev => `
                <div class="event-card relative">
                    <button onclick="selectEvent('${ev.id}')" class="w-full text-left p-2 rounded border ${appData.activeEventId === ev.id ? 'bg-indigo-600/10 border-indigo-500/50' : 'bg-zinc-900/30 border-zinc-900'} hover:border-zinc-700 transition">
                        <div class="text-[7px] font-black text-indigo-400 uppercase">${ev.date ? ev.date.split('-').reverse().join('/') : 'S/ DATA'}</div>
                        <div class="text-[10px] font-bold text-white truncate pr-4">${ev.name}</div>
                    </button>
                    <button onclick="deleteEvent('${ev.id}')" class="delete-btn absolute top-1 right-1 text-zinc-800 hover:text-red-500 text-xs">×</button>
                </div>
            `).join('');
        }

        function selectEvent(id) {
            appData.activeEventId = id;
            const ev = appData.events.find(e => e.id === id);
            if (!ev) return;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editorArea').classList.remove('hidden');
            document.getElementById('curEventName').value = ev.name;
            document.getElementById('curEventDate').value = ev.date;
            document.getElementById('curEventVenue').value = ev.venue;
            renderShifts(ev);
            renderEventList();
        }

        function renderShifts(ev) {
            const tbody = document.getElementById('shiftsBody');
            tbody.innerHTML = ev.shifts.map(s => `
                <tr class="group hover:bg-zinc-900/20">
                    <td class="p-1 align-top text-center">
                        <textarea oninput="updateShiftField('${s.id}', 'label', this.value); adjustHeight(this)" class="bg-transparent border-none text-[8px] font-black text-indigo-500/80 uppercase text-center w-full p-0 focus:ring-0">${s.label || ''}</textarea>
                        <input type="text" value="${s.time}" onchange="updateShiftField('${s.id}', 'time', this.value); sortAndReRender()" class="bg-transparent border-none text-[11px] font-black text-white text-center w-full p-0 focus:ring-0">
                    </td>
                    ${APP_COLUMNS.map(col => `
                        <td class="p-1 border-l border-zinc-900 align-top">
                            <textarea 
                                onclick="showQuickStaff(this, '${s.id}', '${col}')"
                                onkeyup="processShortcodes(this, '${s.id}', '${col}')" 
                                oninput="adjustHeight(this)">${s[col] || ''}</textarea>
                        </td>
                    `).join('')}
                    <td class="p-1 no-print align-top text-center">
                        <button onclick="removeShift('${s.id}')" class="text-zinc-800 hover:text-red-500 text-lg leading-none">×</button>
                    </td>
                </tr>
            `).join('');
            tbody.querySelectorAll('textarea').forEach(adjustHeight);
        }

        function adjustHeight(el) { el.style.height = '32px'; if (el.scrollHeight > 32) el.style.height = el.scrollHeight + 'px'; }

        function sortAndReRender() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if (ev) { ev.shifts.sort((a, b) => (a.time || "00:00").localeCompare(b.time || "00:00")); saveData(); renderShifts(ev); }
        }

        function updateActiveEvent(field, val) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) { ev[field] = val; saveData(); if(field === 'name' || field === 'date') renderEventList(); }
        }

        function updateShiftField(shiftId, field, val) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                const shift = ev.shifts.find(s => s.id === shiftId);
                if(shift) { shift[field] = val; saveData(); }
            }
        }

        // --- SISTEMA DE SELEÇÃO RÁPIDA DE EQUIPA ---
        let currentEditingShift = null;
        let currentEditingField = null;
        let currentTextarea = null;

        function showQuickStaff(textarea, shiftId, field) {
            currentEditingShift = shiftId;
            currentEditingField = field;
            currentTextarea = textarea;

            const picker = document.getElementById('quickStaffPicker');
            const staffList = Object.values(appData.staff);

            if (staffList.length === 0) return;

            picker.innerHTML = staffList.map(s => `
                <div class="staff-item" onclick="selectStaffQuickly('${s.name}')">${s.name}</div>
            `).join('');

            const rect = textarea.getBoundingClientRect();
            picker.style.top = (rect.bottom + window.scrollY) + 'px';
            picker.style.left = (rect.left + window.scrollX) + 'px';
            picker.style.width = rect.width + 'px';
            picker.style.display = 'block';

            const closePicker = (e) => {
                if (!picker.contains(e.target) && e.target !== textarea) {
                    picker.style.display = 'none';
                    document.removeEventListener('mousedown', closePicker);
                }
            };
            document.addEventListener('mousedown', closePicker);
        }

        function selectStaffQuickly(name) {
            if (!currentTextarea) return;
            
            let val = currentTextarea.value.trim();
            if (val.length > 0 && !val.endsWith('\n') && !val.endsWith(',')) {
                val += ', ' + name;
            } else {
                val += (val.length > 0 ? ' ' : '') + name;
            }
            
            currentTextarea.value = val;
            updateShiftField(currentEditingShift, currentEditingField, val);
            adjustHeight(currentTextarea);
            document.getElementById('quickStaffPicker').style.display = 'none';
        }

        function duplicateActiveEvent() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(!ev) return;
            const newEv = JSON.parse(JSON.stringify(ev));
            newEv.id = 'ev_' + Date.now();
            newEv.name += " (CÓPIA)";
            appData.events.unshift(newEv);
            saveData();
            renderEventList();
            selectEvent(newEv.id);
        }

        function processShortcodes(textarea, shiftId, field) {
            const val = textarea.value;
            const regex = /(\b\w+\b)([ ,;\n\r])/g;
            let changed = false;
            const newVal = val.replace(regex, (match, code, delimiter) => {
                if (appData.staff[code.toLowerCase()]) { changed = true; return appData.staff[code.toLowerCase()].name + delimiter; }
                return match;
            });
            if (changed) { textarea.value = newVal; updateShiftField(shiftId, field, newVal); }
            else { updateShiftField(shiftId, field, val); }
            adjustHeight(textarea);
        }

        function processVenueCode(input) {
            const val = input.value;
            for(let code in appData.venues) {
                if(val.toUpperCase() === code.toUpperCase() + " ") {
                    input.value = appData.venues[code];
                    updateActiveEvent('venue', appData.venues[code]);
                    return;
                }
            }
            updateActiveEvent('venue', val);
        }

        function createNewEvent() {
            const id = 'ev_' + Date.now();
            const newEv = {
                id, name: "Novo Espectáculo", date: new Date().toISOString().split('T')[0], venue: "",
                shifts: [{ id: 's1', label: 'MONTAGEM', time: '14:00' }, { id: 's2', label: 'EVENTO', time: '21:30' }]
            };
            APP_COLUMNS.forEach(c => newEv.shifts.forEach(s => s[c] = ''));
            appData.events.unshift(newEv);
            saveData();
            switchTab('events');
            selectEvent(id);
        }

        function deleteEvent(id) {
            if(confirm("Apagar evento permanentemente?")) {
                appData.events = appData.events.filter(e => e.id !== id);
                if(appData.activeEventId === id) appData.activeEventId = null;
                saveData();
                location.reload();
            }
        }

        function addShift() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                const s = { id: 's'+Date.now(), label:'FASE', time:'12:00' };
                APP_COLUMNS.forEach(c => s[c] = '');
                ev.shifts.push(s);
                sortAndReRender();
            }
        }

        function removeShift(id) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev && confirm("Remover fase?")) { ev.shifts = ev.shifts.filter(s => s.id !== id); saveData(); renderShifts(ev); }
        }

        function addStaffMember() {
            let code = document.getElementById('newStaffCode').value.trim().toLowerCase();
            const name = document.getElementById('newStaffName').value.trim();
            if(!name) return;
            if(!code) code = (Object.keys(appData.staff).length + 101).toString();
            appData.staff[code] = { name };
            saveData();
            renderStaff();
            document.getElementById('newStaffName').value = '';
            document.getElementById('newStaffName').focus();
        }

        function renderStaff() {
            document.getElementById('staffGrid').innerHTML = Object.entries(appData.staff).map(([code, data]) => `
                <div class="bg-zinc-900 p-2 rounded flex justify-between items-center group">
                    <div class="truncate pr-2"><span class="text-[8px] text-indigo-500 font-black mr-2">${code.toUpperCase()}</span><span class="text-[10px] font-bold">${data.name}</span></div>
                    <button onclick="deleteStaff('${code}')" class="text-zinc-800 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">×</button>
                </div>
            `).join('');
        }

        function deleteStaff(code) { if(confirm("Eliminar da lista?")) { delete appData.staff[code]; saveData(); renderStaff(); } }

        function addVenue() {
            let code = document.getElementById('newVenueCode').value.trim().toUpperCase();
            const name = document.getElementById('newVenueName').value.trim();
            if(!name) return;
            if(!code) code = name.substring(0, 3).toUpperCase();
            appData.venues[code] = name;
            saveData();
            renderVenues();
            document.getElementById('newVenueName').value = '';
        }

        function renderVenues() {
            document.getElementById('venueGrid').innerHTML = Object.entries(appData.venues).map(([code, name]) => `
                <div class="bg-zinc-900 p-2 rounded flex justify-between items-center group">
                    <div class="truncate pr-2"><span class="text-[8px] text-indigo-400 font-black mr-2">${code}</span><span class="text-[10px] font-bold">${name}</span></div>
                    <button onclick="deleteVenue('${code}')" class="text-zinc-800 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">×</button>
                </div>
            `).join('');
        }

        function updateMonthlyCount() {
            const counts = {}; const displayName = {};
            appData.events.forEach(ev => ev.shifts.forEach(s => {
                const uniqueInShift = new Set();
                APP_COLUMNS.forEach(col => { if (s[col]) s[col].split(/[,\n;]/).forEach(n => {
                    const clean = n.trim(); if(clean.length > 2) { uniqueInShift.add(clean.toLowerCase()); displayName[clean.toLowerCase()] = clean; }
                }); });
                uniqueInShift.forEach(n => counts[n] = (counts[n] || 0) + 1);
            }));
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            document.getElementById('monthlyCounterGrid').innerHTML = sorted.map(([n, c]) => `
                <div class="bg-zinc-900/50 p-2 rounded flex justify-between items-center">
                    <span class="text-[10px] font-bold truncate pr-2">${displayName[n]}</span>
                    <span class="text-indigo-400 text-[9px] font-black">${c}</span>
                </div>
            `).join('');
        }

        // --- SISTEMA DE IMPRESSÃO ---

        function buildEventHTML(ev) {
            const cols = ['Técnicos','Produção','Bilheteira','Portas','Bar / Cozinha','Segurança'];
            const keys = ['tecnicos','producao','bilheteira','portas','bar','seguranca'];
            ev.shifts.sort((a, b) => (a.time || "00:00").localeCompare(b.time || "00:00"));

            const rows = ev.shifts.map(s => `
                <tr>
                    <td style="padding:6px; border:1px solid #000; font-size:9px; vertical-align:top; background:#f5f5f5;">
                        <div style="font-weight:900; text-transform:uppercase; color:#000;">${s.label||''}</div>
                        <div style="font-weight:900; font-size:11px; margin-top:2px;">${s.time||''}</div>
                    </td>
                    ${keys.map(k => `<td style="padding:6px; border:1px solid #000; font-size:10px; vertical-align:top; white-space:pre-wrap;">${s[k]||''}</td>`).join('')}
                </tr>`).join('');

            return `
                <div class="landscape-page" style="margin-bottom:30px; page-break-after:always;">
                    <div style="border-bottom:4px solid #000; padding-bottom:10px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:flex-end;">
                        <div>
                            <h1 style="font-size:24px; font-weight:900; margin:0; text-transform:uppercase; letter-spacing:-0.5px;">${ev.name}</h1>
                            <p style="font-size:12px; margin:4px 0 0; font-weight:700; color:#333;">${ev.date.split('-').reverse().join('/')} &bull; ${ev.venue||'SEM LOCAL'}</p>
                        </div>
                        <div style="font-size:9px; font-weight:900; text-transform:uppercase; color:#000;">Ficha de Produção</div>
                    </div>
                    <table style="width:100%; border-collapse:collapse; table-layout:fixed; border:2px solid #000;">
                        <thead>
                            <tr style="background:#000; color:#fff;">
                                <th style="width:100px; padding:10px; border:1px solid #000; text-align:left; font-size:10px; text-transform:uppercase; font-weight:900;">Horário</th>
                                ${cols.map(c=>`<th style="padding:10px; border:1px solid #000; text-align:left; font-size:10px; text-transform:uppercase; font-weight:900;">${c}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        function executePrint(html, isLandscape = true) {
            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>Backstage PRO</title>
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
                        @page { 
                            size: ${isLandscape ? 'landscape' : 'portrait'}; 
                            margin: 1cm; 
                        }
                        body { font-family: 'Inter', sans-serif; margin: 0; color: #000; }
                        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                        table { width: 100%; }
                    </style>
                </head>
                <body>${html}</body>
                </html>`);
            win.document.close();
            setTimeout(() => { win.print(); }, 400);
        }

        function printSingleEvent() { 
            const ev = appData.events.find(e => e.id === appData.activeEventId); 
            if(ev) executePrint(buildEventHTML(ev), true); 
        }

        function printAllEvents() { 
            if(appData.events.length === 0) return;
            const sorted = [...appData.events].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
            executePrint(sorted.map(ev => buildEventHTML(ev)).join(''), true); 
        }

        function printTurnos() {
            const counts = {}; const displayName = {};
            appData.events.forEach(ev => ev.shifts.forEach(s => {
                const uniqueInShift = new Set();
                APP_COLUMNS.forEach(col => { if (s[col]) s[col].split(/[,\n;]/).forEach(n => {
                    const clean = n.trim(); if(clean.length > 2) { uniqueInShift.add(clean.toLowerCase()); displayName[clean.toLowerCase()] = clean; }
                }); });
                uniqueInShift.forEach(n => counts[n] = (counts[n] || 0) + 1);
            }));
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            
            const html = `
                <div style="border-bottom:4px solid #000; padding-bottom:10px; margin-bottom:15px;">
                    <h1 style="text-transform:uppercase; font-weight:900; margin:0; font-size:20px;">Mapa Acumulado de Turnos</h1>
                </div>
                <table style="width:100%; border-collapse:collapse; font-size:10px;">
                    <thead>
                        <tr style="background:#000; color:#fff;">
                            <th style="padding:6px 10px; text-align:left; border:1px solid #000; font-weight:900; text-transform:uppercase;">Colaborador</th>
                            <th style="padding:6px 10px; text-align:center; width:120px; border:1px solid #000; font-weight:900; text-transform:uppercase;">Total Turnos</th>
                        </tr>
                    </thead>
                    <tbody>
                    ${sorted.map(([n, c]) => `
                        <tr>
                            <td style="padding:3px 10px; border:1px solid #000; font-weight:700; text-transform:uppercase;">${displayName[n]}</td>
                            <td style="padding:3px 10px; border:1px solid #000; text-align:center; font-weight:900; font-size:12px;">${c}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>`;
            executePrint(html, false);
        }

        function exportData() {
            const b = new Blob([JSON.stringify(appData)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'backstage_pro_backup.json'; a.click();
        }

        function importData(e) {
            const r = new FileReader();
            r.onload = (ev) => { appData = JSON.parse(ev.target.result); saveData(); location.reload(); };
            r.readAsText(e.target.files[0]);
        }

        window.onload = () => { 
            renderEventList(); 
            if(appData.activeEventId) selectEvent(appData.activeEventId); 
        };
    </script>
</body>
</html>
