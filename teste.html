<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage PRO - Produção de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root { --accent: #6366f1; --bg-dark: #050505; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: #efefef;
            -webkit-font-smoothing: antialiased;
            font-size: 12px; 
        }

        .tab-btn.active { 
            color: white; 
            border-left: 4px solid var(--accent); 
            padding-left: 12px; 
            background: linear-gradient(90deg, rgba(99,102,241,0.1) 0%, transparent 100%); 
        }
        
        textarea { 
            background-color: #0d0d0d; 
            border: 1px solid #1a1a1a; 
            color: #efefef; 
            min-height: 32px; 
            font-size: 11px;
            line-height: 1.3;
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            resize: none;
            overflow: hidden;
            transition: all 0.2s;
            display: block; 
        }
        
        textarea:focus { border-color: var(--accent) !important; outline: none; background-color: #121212 !important; }

        /* Estilo do Menu de Sugestões e Quick Pick */
        #autocomplete-list, #quick-pick-panel {
            position: absolute;
            z-index: 1000;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            display: none;
        }

        #quick-pick-panel {
            padding: 8px;
            width: 220px;
            max-height: 300px;
            overflow-y: auto;
        }

        .quick-item {
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 2px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .quick-item:hover { background: #27272a; }
        .quick-item.active { background: #6366f1; color: white; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 10px; }

        .main-table { table-layout: fixed; width: 100%; }
        .col-phase { width: 85px; }

        .cell-action {
            opacity: 0;
            transition: opacity 0.2s;
        }
        td:hover .cell-action { opacity: 1; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-52 flex-shrink-0 flex flex-col bg-black border-r border-zinc-900 no-print">
        <div class="p-4 border-b border-zinc-900">
            <h1 class="text-lg font-black tracking-tighter italic uppercase leading-none">Backstage<span class="text-indigo-500">PRO</span></h1>
            <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-[0.2em] mt-1">Ops Suite</p>
        </div>

        <nav class="flex flex-col gap-1 mt-4 px-2">
            <button onclick="switchTab('events')" id="btn-tab-events" class="tab-btn active text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition">📅 Agenda</button>
            <button onclick="switchTab('staff')" id="btn-tab-staff" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">👥 Equipa</button>
            <button onclick="switchTab('venues')" id="btn-tab-venues" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">📍 Locais</button>
            <button onclick="switchTab('counter')" id="btn-tab-counter" class="tab-btn text-left py-2.5 px-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 hover:text-white transition">📊 Turnos</button>
        </nav>

        <div class="mt-auto p-4 border-t border-zinc-900 space-y-2">
            <div class="flex gap-1.5">
                <button onclick="exportData()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-500 py-2 rounded text-[8px] font-bold uppercase">Export</button>
                <button onclick="document.getElementById('importFile').click()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-500 py-2 rounded text-[8px] font-bold uppercase">Import</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
            <button onclick="printAllEvents()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2 rounded-lg text-[9px] uppercase tracking-widest transition">🖨️ Imprimir Agenda</button>
            <button onclick="createNewEvent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-lg text-[10px] uppercase tracking-widest transition shadow-lg shadow-indigo-900/20">+ Novo Evento</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-zinc-950 p-4">
        
        <div id="eventsView">
            <div class="flex flex-col lg:flex-row gap-4 h-full">
                <div class="w-full lg:w-48 no-print shrink-0">
                    <h2 class="text-[9px] font-black text-zinc-600 uppercase tracking-widest mb-3 px-1">Próximos Dias</h2>
                    <div id="eventList" class="space-y-1"></div>
                </div>

                <div id="editorContainer" class="flex-1 min-w-0">
                    <div id="emptyState" class="flex flex-col items-center justify-center h-64 border border-dashed border-zinc-900 rounded-2xl text-zinc-800 text-[10px] font-black uppercase tracking-widest italic">Nenhum evento selecionado</div>

                    <div id="editorArea" class="hidden relative">
                        <header class="flex justify-between items-start mb-4 border-b border-zinc-900 pb-4">
                            <div class="flex-1 min-w-0 pr-4">
                                <input type="text" id="curEventName" oninput="updateActiveEvent('name', this.value)" class="bg-transparent border-none text-2xl font-black text-white p-0 focus:ring-0 w-full truncate" placeholder="Título">
                                <div class="flex flex-wrap gap-3 mt-1">
                                    <input type="date" id="curEventDate" oninput="updateActiveEvent('date', this.value)" class="bg-transparent border-none text-[10px] font-bold uppercase focus:ring-0 p-0 [color-scheme:dark] text-indigo-400 w-28">
                                    <input type="text" id="curEventVenue" oninput="updateActiveEvent('venue', this.value)" placeholder="Local do Evento" class="bg-transparent border-none text-[10px] font-bold uppercase focus:ring-0 p-0 text-zinc-500 flex-1 min-w-[120px]">
                                </div>
                            </div>
                            <div class="flex gap-1.5 no-print shrink-0">
                                <button onclick="duplicateActiveEvent()" class="bg-zinc-900 p-2 rounded text-zinc-400 hover:text-white transition" title="Duplicar">👯</button>
                                <button onclick="addShift()" class="bg-zinc-900 px-3 py-2 rounded text-[9px] font-black uppercase text-zinc-400 hover:bg-zinc-800 transition">+ Fase</button>
                                <button onclick="printSingleEvent()" class="bg-white text-black px-3 py-2 rounded text-[9px] font-black uppercase shadow-lg hover:bg-zinc-200 transition">Imprimir</button>
                            </div>
                        </header>

                        <div class="rounded-xl border border-zinc-900 bg-zinc-900/10 overflow-hidden">
                            <table class="main-table">
                                <thead>
                                    <tr class="bg-zinc-900 text-[8px] font-black text-zinc-500 uppercase tracking-widest">
                                        <th class="p-2 col-phase text-center">Fase/Hora</th>
                                        <th class="p-2 border-l border-zinc-800">Técnicos</th>
                                        <th class="p-2 border-l border-zinc-800">Produção</th>
                                        <th class="p-2 border-l border-zinc-800">Bilheteira</th>
                                        <th class="p-2 border-l border-zinc-800">Portas</th>
                                        <th class="p-2 border-l border-zinc-800">Bar/Coz.</th>
                                        <th class="p-2 border-l border-zinc-800">Segur.</th>
                                        <th class="p-2 w-8 no-print"></th>
                                    </tr>
                                </thead>
                                <tbody id="shiftsBody" class="divide-y divide-zinc-900/50"></tbody>
                            </table>
                        </div>
                        <div id="autocomplete-list" class="hidden"></div>
                        <div id="quick-pick-panel" class="hidden"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="staffView" class="hidden">
            <h2 class="text-lg font-black uppercase mb-4 italic">Equipa</h2>
            <div class="flex gap-2 mb-6 max-w-xl">
                <input type="text" id="newStaffName" onkeydown="if(event.key === 'Enter') addStaffMember()" placeholder="Nome do Colaborador" class="flex-1 bg-zinc-900 border-none rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500">
                <button onclick="addStaffMember()" class="bg-indigo-600 px-4 py-2 rounded text-[9px] font-black uppercase">Adicionar</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2" id="staffGrid"></div>
        </div>

        <!-- Outros separadores omitidos para brevidade no script central -->
        <div id="venuesView" class="hidden"></div>
        <div id="counterView" class="hidden">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 class="text-lg font-black uppercase italic">Mapa de Turnos</h2>
                <button onclick="printTurnos()" class="bg-indigo-600 px-4 py-2 rounded text-[9px] font-black uppercase">Imprimir Mapa</button>
            </div>
            <div id="monthlyCounterGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2 px-2"></div>
        </div>
    </main>

    <script>
        const APP_COLUMNS = ['tecnicos', 'producao', 'bilheteira', 'portas', 'bar', 'seguranca'];
        let appData = JSON.parse(localStorage.getItem('backstage_pro_v3')) || { events: [], staff: [], venues: [], activeEventId: null };

        function saveData() { localStorage.setItem('backstage_pro_v3', JSON.stringify(appData)); }

        function switchTab(tab) {
            ['events', 'staff', 'venues', 'counter'].forEach(t => {
                const el = document.getElementById(t + 'View');
                if(el) el.classList.add('hidden');
                document.getElementById('btn-tab-' + t).classList.remove('active');
            });
            document.getElementById(tab + 'View').classList.remove('hidden');
            document.getElementById('btn-tab-' + tab).classList.add('active');
            if(tab === 'staff') renderStaff();
            if(tab === 'counter') updateMonthlyCount();
            if(tab === 'events') renderEventList();
        }

        function renderEventList() {
            const list = document.getElementById('eventList');
            const sorted = [...appData.events].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
            list.innerHTML = sorted.map(ev => `
                <div class="group relative">
                    <button onclick="selectEvent('${ev.id}')" class="w-full text-left p-2 rounded border ${appData.activeEventId === ev.id ? 'bg-indigo-600/10 border-indigo-500/50' : 'bg-zinc-900/30 border-zinc-900'} hover:border-zinc-700 transition">
                        <div class="text-[7px] font-black text-indigo-400 uppercase">${ev.date ? ev.date.split('-').reverse().join('/') : 'S/ DATA'}</div>
                        <div class="text-[10px] font-bold text-white truncate pr-4">${ev.name}</div>
                    </button>
                    <button onclick="deleteEvent('${ev.id}')" class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 text-zinc-800 hover:text-red-500 text-xs">×</button>
                </div>
            `).join('');
        }

        function selectEvent(id) {
            appData.activeEventId = id;
            const ev = appData.events.find(e => e.id === id);
            if (!ev) return;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editorArea').classList.remove('hidden');
            document.getElementById('curEventName').value = ev.name;
            document.getElementById('curEventDate').value = ev.date;
            document.getElementById('curEventVenue').value = ev.venue;
            renderShifts(ev);
            renderEventList();
        }

        function renderShifts(ev) {
            const tbody = document.getElementById('shiftsBody');
            tbody.innerHTML = ev.shifts.map(s => `
                <tr class="group hover:bg-zinc-900/10">
                    <td class="p-1 align-top text-center">
                        <textarea oninput="updateShiftField('${s.id}', 'label', this.value); adjustHeight(this)" class="bg-transparent border-none text-[8px] font-black text-indigo-500/80 uppercase text-center w-full p-0 focus:ring-0">${s.label || ''}</textarea>
                        <input type="text" value="${s.time}" onchange="updateShiftField('${s.id}', 'time', this.value); sortAndReRender()" class="bg-transparent border-none text-[11px] font-black text-white text-center w-full p-0 focus:ring-0">
                    </td>
                    ${APP_COLUMNS.map(col => `
                        <td class="p-1 border-l border-zinc-900 align-top relative">
                            <textarea id="ta-${s.id}-${col}" oninput="handleInput(this, '${s.id}', '${col}')" onfocus="handleInput(this, '${s.id}', '${col}')">${s[col] || ''}</textarea>
                            <button onclick="toggleQuickPick(event, '${s.id}', '${col}')" class="cell-action absolute bottom-2 right-2 bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shadow-lg no-print">➕</button>
                        </td>
                    `).join('')}
                    <td class="p-1 no-print align-top text-center">
                        <button onclick="removeShift('${s.id}')" class="text-zinc-800 hover:text-red-500 text-lg">×</button>
                    </td>
                </tr>
            `).join('');
            tbody.querySelectorAll('textarea').forEach(adjustHeight);
        }

        // --- QUICK PICK LOGIC ---
        let currentTarget = null;
        function toggleQuickPick(e, shiftId, col) {
            e.stopPropagation();
            const panel = document.getElementById('quick-pick-panel');
            const textarea = document.getElementById(`ta-${shiftId}-${col}`);
            
            if (currentTarget?.id === `ta-${shiftId}-${col}` && panel.style.display === 'block') {
                panel.style.display = 'none';
                return;
            }

            currentTarget = { id: `ta-${shiftId}-${col}`, shiftId, col };
            const rect = e.target.getBoundingClientRect();
            const container = document.getElementById('editorArea').getBoundingClientRect();
            
            panel.style.display = 'block';
            panel.style.top = (rect.bottom - container.top + 5) + 'px';
            panel.style.left = (rect.left - container.left - 200) + 'px';
            
            renderQuickPickItems(textarea.value);
        }

        function renderQuickPickItems(currentValue) {
            const panel = document.getElementById('quick-pick-panel');
            const selectedNames = currentValue.split('\n').map(n => n.trim()).filter(n => n);
            
            panel.innerHTML = `
                <div class="text-[9px] font-black text-zinc-500 uppercase px-2 mb-2">Equipa</div>
                ${appData.staff.map(name => {
                    const isActive = selectedNames.includes(name);
                    return `<div class="quick-item ${isActive ? 'active' : ''}" onclick="selectFromQuickPick('${name.replace(/'/g, "\\'")}')">
                        ${name} <span>${isActive ? '✓' : ''}</span>
                    </div>`;
                }).join('')}
            `;
        }

        function selectFromQuickPick(name) {
            const textarea = document.getElementById(currentTarget.id);
            let names = textarea.value.split('\n').map(n => n.trim()).filter(n => n);
            
            if (names.includes(name)) names = names.filter(n => n !== name);
            else names.push(name);
            
            textarea.value = names.join('\n');
            if (names.length > 0) textarea.value += '\n';
            
            updateShiftField(currentTarget.shiftId, currentTarget.col, textarea.value);
            adjustHeight(textarea);
            renderQuickPickItems(textarea.value);
        }

        // Fechar painéis ao clicar fora
        document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('#quick-pick-panel') && !e.target.closest('.cell-action')) {
                document.getElementById('quick-pick-panel').style.display = 'none';
            }
            if (!e.target.closest('#autocomplete-list')) {
                document.getElementById('autocomplete-list').classList.add('hidden');
            }
        });

        // --- AUTO-COMPLETE ---
        function handleInput(el, shiftId, field) {
            adjustHeight(el);
            updateShiftField(shiftId, field, el.value);
            const lines = el.value.split('\n');
            const currentLine = lines[lines.length - 1].toLowerCase().trim();
            if (currentLine.length < 1) { hideAutocomplete(); return; }
            const matches = appData.staff.filter(name => name.toLowerCase().includes(currentLine));
            if (matches.length > 0) showAutocomplete(el, matches);
            else hideAutocomplete();
        }

        function showAutocomplete(el, matches) {
            const list = document.getElementById('autocomplete-list');
            const rect = el.getBoundingClientRect();
            const container = document.getElementById('editorArea').getBoundingClientRect();
            list.style.display = 'block';
            list.classList.remove('hidden');
            list.style.left = (rect.left - container.left) + 'px';
            list.style.top = (rect.bottom - container.top + 5) + 'px';
            list.innerHTML = matches.map(name => `
                <div class="suggestion-item p-2 hover:bg-zinc-800 cursor-pointer text-[10px]" onmousedown="applySuggestion('${name.replace(/'/g, "\\'")}', '${el.id}')">${name}</div>
            `).join('');
        }

        function applySuggestion(name, elId) {
            const el = document.getElementById(elId);
            const lines = el.value.split('\n');
            lines[lines.length - 1] = name;
            el.value = lines.join('\n') + '\n';
            el.dispatchEvent(new Event('input'));
            hideAutocomplete();
        }

        function hideAutocomplete() { document.getElementById('autocomplete-list').classList.add('hidden'); }

        function adjustHeight(el) { 
            el.style.height = '32px'; 
            if (el.scrollHeight > 32) el.style.height = el.scrollHeight + 'px'; 
        }

        function updateShiftField(shiftId, field, val) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                const shift = ev.shifts.find(s => s.id === shiftId);
                if(shift) { shift[field] = val; saveData(); }
            }
        }

        function addShift() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                ev.shifts.push({ id: 's' + Date.now(), label: 'NOVA FASE', time: '00:00', ...Object.fromEntries(APP_COLUMNS.map(c => [c, ''])) });
                saveData(); renderShifts(ev);
            }
        }

        function removeShift(id) {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) { ev.shifts = ev.shifts.filter(s => s.id !== id); saveData(); renderShifts(ev); }
        }

        function duplicateActiveEvent() {
            const ev = appData.events.find(e => e.id === appData.activeEventId);
            if(ev) {
                const newEv = JSON.parse(JSON.stringify(ev));
                newEv.id = 'ev_' + Date.now();
                newEv.name += " (Cópia)";
                appData.events.unshift(newEv);
                saveData(); renderEventList(); selectEvent(newEv.id);
            }
        }

        function addStaffMember() {
            const name = document.getElementById('newStaffName').value.trim();
            if(!name || appData.staff.includes(name)) return;
            appData.staff.push(name);
            appData.staff.sort();
            saveData(); renderStaff();
            document.getElementById('newStaffName').value = '';
        }

        function renderStaff() {
            document.getElementById('staffGrid').innerHTML = appData.staff.map(name => `
                <div class="bg-zinc-900 p-2 rounded flex justify-between items-center group">
                    <span class="text-[10px] font-bold truncate uppercase">${name}</span>
                    <button onclick="deleteStaff('${name.replace(/'/g, "\\'")}')" class="text-zinc-800 hover:text-red-500 opacity-0 group-hover:opacity-100">×</button>
                </div>
            `).join('');
        }

        function deleteStaff(name) { if(confirm(`Remover ${name}?`)) { appData.staff = appData.staff.filter(n => n !== name); saveData(); renderStaff(); } }

        function deleteEvent(id) { if(confirm("Eliminar evento?")) { appData.events = appData.events.filter(e => e.id !== id); if(appData.activeEventId === id) appData.activeEventId = null; saveData(); location.reload(); } }

        function updateMonthlyCount() {
            const counts = {};
            appData.events.forEach(ev => ev.shifts.forEach(s => {
                const shiftStaff = new Set();
                APP_COLUMNS.forEach(col => { if(s[col]) s[col].split('\n').forEach(n => { if(n.trim().length > 1) shiftStaff.add(n.trim()); })});
                shiftStaff.forEach(name => counts[name] = (counts[name] || 0) + 1);
            }));
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            document.getElementById('monthlyCounterGrid').innerHTML = sorted.map(([n, c]) => `
                <div class="bg-zinc-900 p-2 rounded flex justify-between items-center border border-zinc-800">
                    <span class="text-[10px] font-bold truncate uppercase pr-2">${n}</span>
                    <span class="bg-indigo-600/20 text-indigo-400 text-[9px] font-black px-2 py-0.5 rounded">${c}</span>
                </div>
            `).join('');
        }

        function createNewEvent() {
            const id = 'ev_' + Date.now();
            const newEv = {
                id, name: "Novo Espectáculo", date: new Date().toISOString().split('T')[0], venue: "",
                shifts: [{ id: 's1', label: 'MONTAGEM', time: '14:00', ...Object.fromEntries(APP_COLUMNS.map(c => [c, ''])) }]
            };
            appData.events.unshift(newEv); saveData(); selectEvent(id);
        }

        // --- IMPRESSÃO ---
        function executePrint(html, isLandscape = true) {
            const win = window.open('', '_blank');
            win.document.write(`<html><head><style>
                @page { size: ${isLandscape ? 'landscape' : 'portrait'}; margin: 1cm; }
                body { font-family: 'Inter', sans-serif; margin: 0; color: #000; }
                table { width: 100%; border-collapse: collapse; border: 2px solid #000; }
                th { background: #000 !important; color: #fff !important; font-weight: 900; text-transform: uppercase; font-size: 10px; padding: 8px; border: 1px solid #000; text-align: left; }
                td { border: 1px solid #000; padding: 8px; font-size: 10px; vertical-align: top; white-space: pre-wrap; font-weight: 500; }
                .header { border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
                * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            </style></head><body>${html}</body></html>`);
            win.document.close();
            setTimeout(() => win.print(), 500);
        }

        function buildEventHTML(ev) {
            const cols = ['Técnicos','Produção','Bilheteira','Portas','Bar / Cozinha','Segurança'];
            const keys = APP_COLUMNS;
            const rows = [...ev.shifts].sort((a,b) => a.time.localeCompare(b.time)).map(s => `
                <tr>
                    <td style="width:90px; background:#f0f0f0; font-weight:900;">${s.label}<br><span style="font-size:12px;">${s.time}</span></td>
                    ${keys.map(k => `<td>${s[k]}</td>`).join('')}
                </tr>`).join('');
            return `<div style="page-break-after:always;">
                <div class="header"><div><h1 style="margin:0; font-size:22px; text-transform:uppercase;">${ev.name}</h1>
                <p style="margin:0; font-weight:700;">${ev.date.split('-').reverse().join('/')} &bull; ${ev.venue}</p></div></div>
                <table><thead><tr><th>Fase</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
            </div>`;
        }

        function printSingleEvent() { const ev = appData.events.find(e => e.id === appData.activeEventId); if(ev) executePrint(buildEventHTML(ev), true); }
        function printAllEvents() { executePrint(appData.events.map(ev => buildEventHTML(ev)).join(''), true); }
        function printTurnos() {
            const counts = {};
            appData.events.forEach(ev => ev.shifts.forEach(s => {
                const shiftStaff = new Set();
                APP_COLUMNS.forEach(col => { if(s[col]) s[col].split('\n').forEach(n => { if(n.trim().length>1) shiftStaff.add(n.trim()); })});
                shiftStaff.forEach(name => counts[name] = (counts[name] || 0) + 1);
            }));
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            const html = `<h1>TURNOS ACUMULADOS</h1><table><thead><tr><th>NOME</th><th>TURNOS</th></tr></thead>
                <tbody>${sorted.map(([n,c]) => `<tr><td style="font-weight:700;">${n}</td><td style="font-weight:900;">${c}</td></tr>`).join('')}</tbody></table>`;
            executePrint(html, false);
        }

        function updateActiveEvent(f, v) { const ev = appData.events.find(e => e.id === appData.activeEventId); if(ev) { ev[f] = v; saveData(); if(f==='name'||f==='date') renderEventList(); } }
        function exportData() { const b = new Blob([JSON.stringify(appData)],{type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'backstage_backup.json'; a.click(); }
        function importData(e) { const reader = new FileReader(); reader.onload = (ev) => { appData = JSON.parse(ev.target.result); saveData(); location.reload(); }; reader.readAsText(e.target.files[0]); }

        window.onload = () => { renderEventList(); if(appData.activeEventId) selectEvent(appData.activeEventId); };
    </script>
</body>
</html>
